name: CI

# Every push and pull request is checked and built for all platforms; the
# binaries are kept as workflow artifacts. Pushing a tag like v1.2.0 also
# publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Current Go, not go.mod's minimum: recent macOS won't run binaries
      # from older toolchains ("missing LC_UUID load command").
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no dependencies to cache
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - name: Build and run natively
        shell: bash
        run: |
          go build -o wiser-dashboard-smoke .
          ./wiser-dashboard-smoke -version

  # The Matter bridge paired with a real Matter controller on each OS: pairing
  # over mDNS, every command, restarts; a mock stands in for the hub. The app
  # is built with tools/build, the same script as the releases and README.
  matter-test:
    name: Matter test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS runners can't grant Local Network permission, which mDNS needs, so
      # no controller can pair there: check that everything starts and stops.
      MATTER_TEST_STARTUP_ONLY: ${{ matrix.os == 'macos-latest' && '1' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matter/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build with the build script
        run: go run ./tools/build -matter=on
      - run: npm run typecheck
        working-directory: matter
      - name: Bridge test
        working-directory: matter
        run: |
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          node test/e2e.mjs "dist/wiser-matter-$(go env GOOS)-$(go env GOARCH)$exe"
      # The whole app: needs SIGTERM for a clean stop, so not on Windows.
      - name: Whole-system test
        if: runner.os != 'Windows'
        working-directory: matter
        run: node test/system.mjs ../wiser-dashboard

  build:
    name: Build ${{ matrix.target }}
    needs: [check, matter-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, linux/arm, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for git describe
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matter/package-lock.json
      # Embeds the Matter bridge where Bun supports the platform (not 32-bit ARM).
      - name: Build and package
        run: |
          go run ./tools/build -target "${{ matrix.target }}" -matter=on -package
          echo "NAME=$(cd dist && ls *.tar.gz *.zip 2>/dev/null | head -1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The one-line installers, run the way users run them, against the latest
  # release: install, check it answers, run again (upgrade), uninstall.
  install-test:
    name: Installer (${{ matrix.os }})
    if: "!startsWith(github.ref, 'refs/tags/')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install, upgrade and uninstall (install.sh)
        if: runner.os != 'Windows'
        run: |
          set -e
          cat install.sh | sh
          curl -fsS -o /dev/null http://127.0.0.1:8080/api/state
          if [ "$RUNNER_OS" = Linux ]; then
            systemctl is-active wiser-dashboard
            test "$(systemctl show -p NRestarts --value wiser-dashboard)" = 0
          fi
          cat install.sh | sh                       # upgrade in place
          curl -fsS -o /dev/null http://127.0.0.1:8080/api/state
          cat install.sh | sh -s -- --uninstall --purge
          sleep 3
          ! curl -fsS -o /dev/null http://127.0.0.1:8080/api/state
      - name: Install, upgrade and uninstall (install.ps1)
        if: runner.os == 'Windows'
        shell: powershell # Windows PowerShell 5.1, what most people have
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/state | Out-Null
          if (-not (Test-Path "$([Environment]::GetFolderPath('Startup'))\Wiser Dashboard.lnk")) { throw 'no startup shortcut' }
          if (-not (Get-NetFirewallRule -DisplayName 'Wiser Dashboard' -ErrorAction SilentlyContinue)) { throw 'no firewall rule' }
          Get-Content -Raw install.ps1 | Invoke-Expression   # upgrade in place
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/state | Out-Null
          $env:WISER_UNINSTALL = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          Start-Sleep -Seconds 3
          $up = $true; try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8080/api/state | Out-Null } catch { $up = $false }
          if ($up) { throw 'still running after uninstall' }

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # for the signing tool
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wiser-dashboard-* # only the release archives
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Updates install a release only if this signature verifies against the
      # keys built into the program (internal/releasekeys). Without the secret,
      # or with a key that isn't one of them, the release fails here.
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./tools/sign dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $flags dist/*

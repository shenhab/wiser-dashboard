name: CI

# Every push and pull request is checked and built for all platforms; the
# binaries are kept as workflow artifacts. Pushing a tag like v1.2.0 also
# publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Current Go, not go.mod's minimum: recent macOS won't run binaries
      # from older toolchains ("missing LC_UUID load command").
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no dependencies to cache
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - name: Build and run natively
        shell: bash
        run: |
          go build -o wiser-dashboard-smoke .
          ./wiser-dashboard-smoke -version

  # The Matter bridge (matter/) paired with a real Matter controller on each OS:
  # pairing over mDNS, every command, restarts. A mock stands in for the hub.
  matter-test:
    name: Matter test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS runners can't grant Local Network permission, which mDNS needs, so
      # no controller can pair there: check that everything starts and stops.
      MATTER_TEST_STARTUP_ONLY: ${{ matrix.os == 'macos-latest' && '1' || '' }}
    defaults:
      run:
        shell: bash
        working-directory: matter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matter/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: npm ci
      - run: npm run typecheck
      - name: Build the bridge
        run: npx bun build --compile src/main.ts --outfile dist/wiser-matter
      - name: Bridge test
        run: node test/e2e.mjs dist/wiser-matter$([ "$RUNNER_OS" = Windows ] && echo .exe)
      # The whole app: needs SIGTERM for a clean stop, so not on Windows.
      - name: Whole-system test
        if: runner.os != 'Windows'
        run: |
          mkdir -p ../matterbin && cp dist/wiser-matter ../matterbin/wiser-matter
          (cd .. && go build -tags matter -o wiser-dashboard .)
          node test/system.mjs ../wiser-dashboard

  # Cross-compiles the bridge for every platform that gets it embedded.
  matter-build:
    name: Build Matter bridge
    needs: matter-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matter/package-lock.json
      - run: npm ci
      - name: Build
        run: |
          # "baseline" x64 builds also run on older CPUs (mini PCs, NAS boxes).
          for t in linux-amd64:linux-x64-baseline linux-arm64:linux-arm64 \
                   darwin-amd64:darwin-x64-baseline darwin-arm64:darwin-arm64 \
                   windows-amd64:windows-x64-baseline windows-arm64:windows-arm64; do
            npx bun build --compile --target="bun-${t#*:}" src/main.ts --outfile "out/${t%%:*}"
          done
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: matter-bridges
          path: matter/out/* # Bun adds .exe for Windows targets
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [check, matter-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for git describe
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: matter-bridges
          path: bridges
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          version=$(git describe --tags --always --dirty)
          name="wiser-dashboard-$version-$GOOS-$GOARCH"
          [ "$GOARCH" = arm ] && name="${name}v$GOARM"
          bin=wiser-dashboard
          [ "$GOOS" = windows ] && bin=wiser-dashboard.exe

          # Embed the Matter bridge where Bun supports the platform (not 32-bit ARM).
          tags=""
          bridge="bridges/$GOOS-$GOARCH"
          [ "$GOOS" = windows ] && bridge="$bridge.exe"
          if [ -f "$bridge" ]; then
            mkdir -p matterbin && cp "$bridge" matterbin/wiser-matter
            tags="-tags=matter"
          else
            echo "::notice::$GOOS/$GOARCH is built without the Matter bridge"
          fi

          mkdir -p "pkg/$name" dist
          go build $tags -trimpath -ldflags="-s -w -X main.version=$version" -o "pkg/$name/$bin" .
          cp README.md "pkg/$name/"
          [ "$GOOS" = linux ] && cp deploy/wiser-dashboard.service "pkg/$name/"
          cd pkg
          if [ "$GOOS" = windows ]; then
            zip -qr "../dist/$name.zip" "$name"
          else
            tar -czf "../dist/$name.tar.gz" "$name"
          fi
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $flags dist/*
